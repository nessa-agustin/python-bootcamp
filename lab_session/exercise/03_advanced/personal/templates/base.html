<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Site</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"/>
</head>
<body>
<!-- {% block content %}{% endblock %} -->
 <h1 class="">Shopping List</h1>

    <form method="post">
        <input type="text" name="item" placeholder="Enter item" />
        <button type="submit" class="btn btn-small btn-primary">Add</button>
    </form>

    <ol>
        {% for item in shopping_list %}
            <li>{{item}} 
                <span>
                    <form action="/shopping/delete/{{shopping_list.index(item)}}" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-sm btn-danger">Delete {{shopping_list.index(item)}}</button>
                    </form>
                </span>
            </li>
        {% endfor %}
    </ol>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
</body>
</html>
